<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet-Shop67 - Agendamento de Serviços</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">💈 🐾 Pet-Shop67 - Agendamento Online</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div id="areaAlertas"></div>

        <div class="row g-4">
            
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title m-0 fw-bold text-primary">Agendar Serviço</h5>
                    </div>
                    <div class="card-body">
                        <form id="formAgendamento">
                            <div class="mb-3">
                                <label for="nomePet" class="form-label font-weight-bold">Nome do Pet</label>
                                <input type="text" class="form-control" id="nomePet" placeholder="Ex: Thor, Mia, Mel" required>
                            </div>

                            <div class="mb-3">
                                <label for="tipo" class="form-label">Tipo de Animal</label>
                                <select class="form-select" id="tipo" required>
                                    <option value="cachorro">Cachorro 🐶</option>
                                    <option value="gato">Gato 🐱</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="servico" class="form-label">Serviço Desejado</label>
                                <select class="form-select" id="servico" required>
                                    <option value="Banho">Banho</option>
                                    <option value="Tosa">Tosa</option>
                                    <option value="Banho e Tosa">Banho e Tosa</option>
                                    <option value="Atendimento Médico">Atendimento Médico</option>
                                    <option value="Castramento">Castramento</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="observacoes" class="form-label">Observações / Cuidados Especial</label>
                                <textarea class="form-control" id="observacoes" rows="3" placeholder="Ex: Alergias, dócil, medo de secador..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold">Confirmar Agendamento</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="card-title m-0 fw-bold text-dark">Agendamentos Confirmados</h5>
                        <button id="btnAtualizar" class="btn btn-sm btn-outline-secondary">🔄 Atualizar Lista</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle m-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Pet</th>
                                        <th>Tipo</th>
                                        <th>Serviço</th>
                                        <th>Observações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaAgendamentos">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
